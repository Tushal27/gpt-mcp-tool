services:
  - type: web
    name: ff-mcp-memory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.asgi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
